&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {string} property
   */

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  const postToHost = (type, payload) =&gt; {

      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

      },
    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;

      return;
    }

        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  syncTheme();
})();

&lt;div id=&quot;storylens-designs&quot; aria-label=&quot;Знакомый редактор&quot;&gt;
  &lt;section data-variant=&quot;Знакомый редактор&quot; aria-label=&quot;Знакомый редактор&quot;&gt;
    &lt;div class=&quot;sl-window sl-fluent&quot; data-design=&quot;familiar&quot; aria-label=&quot;Знакомый редактор — оформление&quot;&gt;
      &lt;header class=&quot;sl-masthead&quot;&gt;&lt;div class=&quot;sl-brand&quot;&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;&lt;/i&gt;StoryLens&lt;/div&gt;&lt;div class=&quot;sl-bookname&quot;&gt;Дорога к морю&lt;/div&gt;&lt;span class=&quot;sl-spacer&quot;&gt;&lt;/span&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;focus&quot; aria-pressed=&quot;false&quot;&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;⤢&lt;/i&gt;&lt;span&gt;Только текст&lt;/span&gt;&lt;/button&gt;&lt;/header&gt;
      &lt;nav class=&quot;sl-viewnav&quot; aria-label=&quot;Разделы книги&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; data-view=&quot;text&quot; aria-pressed=&quot;true&quot;&gt;Текст&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-view=&quot;plan&quot; aria-pressed=&quot;false&quot;&gt;План сцен&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-view=&quot;timeline&quot; aria-pressed=&quot;false&quot;&gt;Хронология&lt;/button&gt;&lt;span class=&quot;sl-spacer&quot;&gt;&lt;/span&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;materials&quot; aria-pressed=&quot;false&quot;&gt;Материалы&lt;/button&gt;&lt;/nav&gt;
      &lt;div class=&quot;sl-ribbon&quot; aria-label=&quot;Образец панели оформления&quot;&gt;&lt;div class=&quot;sl-ribbongroup&quot;&gt;&lt;span&gt;Основной текст&lt;/span&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;⌄&lt;/i&gt;&lt;/div&gt;&lt;span class=&quot;sl-formatrule&quot;&gt;&lt;/span&gt;&lt;div class=&quot;sl-ribbongroup&quot;&gt;&lt;span style=&quot;font-weight:500&quot;&gt;Ж&lt;/span&gt;&lt;span style=&quot;font-style:italic&quot;&gt;К&lt;/span&gt;&lt;span style=&quot;text-decoration:underline&quot;&gt;Ч&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;sl-formatrule&quot;&gt;&lt;/span&gt;&lt;div class=&quot;sl-ribbongroup&quot;&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;≡&lt;/i&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;☷&lt;/i&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;“ ”&lt;/i&gt;&lt;/div&gt;&lt;span class=&quot;sl-ribbonlabel&quot;&gt;Оформление текста&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;sl-layout&quot;&gt;&lt;aside class=&quot;sl-sidebar&quot; aria-label=&quot;Главы книги&quot;&gt;&lt;p class=&quot;sl-sectionlabel&quot;&gt;Главы книги&lt;/p&gt;&lt;nav class=&quot;sl-chapters&quot; aria-label=&quot;Выбрать главу&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; data-chapter=&quot;0&quot; aria-pressed=&quot;false&quot;&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;&lt;/i&gt;&lt;span&gt;1. Письмо&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-chapter=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;&lt;/i&gt;&lt;span&gt;2. Чужой город&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-chapter=&quot;2&quot; aria-pressed=&quot;true&quot;&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;&lt;/i&gt;&lt;span&gt;3. Станция у моря&lt;/span&gt;&lt;/button&gt;&lt;/nav&gt;&lt;p class=&quot;sl-sidefoot&quot;&gt;Дорога к морю&lt;/p&gt;&lt;/aside&gt;&lt;main class=&quot;sl-main&quot;&gt;&lt;div class=&quot;sl-toolbar&quot;&gt;Книга первая &lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;›&lt;/i&gt;&lt;span data-chapter-label&gt;Станция у моря&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sl-pane&quot; data-pane&gt;&lt;/div&gt;&lt;/main&gt;&lt;aside class=&quot;sl-materials&quot; aria-label=&quot;Материалы книги&quot; data-material-panel hidden&gt;&lt;/aside&gt;&lt;/div&gt;
      &lt;footer class=&quot;sl-footer&quot;&gt;&lt;span data-context&gt;Глава 3 из 3&lt;/span&gt;&lt;span&gt;Русский · непрерывный текст&lt;/span&gt;&lt;/footer&gt;

&lt;template id=&quot;sl-document-template&quot;&gt;&lt;article class=&quot;sl-document&quot;&gt;&lt;div class=&quot;sl-breadcrumb&quot; data-document-kicker&gt;Глава третья&lt;/div&gt;&lt;h2 data-document-title&gt;Станция у моря&lt;/h2&gt;&lt;div data-document-prose&gt;&lt;p&gt;Поезд ушёл, и станция сразу стала маленькой. Остались мокрые рельсы, пустая скамейка и женщина в синем плаще у закрытой кассы.&lt;/p&gt;&lt;p&gt;Лида поставила чемодан на землю. В детстве ей казалось, что море начинается прямо за вокзалом. Теперь за ним стоял продуктовый магазин, а дальше тянулись одинаковые серые заборы.&lt;/p&gt;&lt;p class=&quot;sl-dialogue&quot;&gt;— Вы к кому? — спросила женщина.&lt;/p&gt;&lt;p class=&quot;sl-dialogue&quot;&gt;— К Марине Соколовой.&lt;/p&gt;&lt;p&gt;Женщина посмотрела на чемодан. За домами протяжно загудел корабль, и Лида наконец почувствовала запах соли.&lt;span class=&quot;sl-endmark&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;/template&gt;
&lt;template id=&quot;sl-plan-template&quot;&gt;&lt;section class=&quot;sl-board&quot; aria-label=&quot;План сцен&quot;&gt;&lt;h2&gt;План сцен&lt;/h2&gt;&lt;p class=&quot;sl-subtitle&quot;&gt;Глава 3 · Станция у моря&lt;/p&gt;&lt;article class=&quot;sl-scene&quot;&gt;&lt;span class=&quot;sl-order&quot;&gt;1&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Возвращение&lt;/h3&gt;&lt;p&gt;Лида приезжает в город детства. На станции её встречает незнакомая женщина, которая знает Марину.&lt;/p&gt;&lt;small&gt;Станция · Лида, смотрительница&lt;/small&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;sl-scene&quot;&gt;&lt;span class=&quot;sl-order&quot;&gt;2&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Дорога к дому&lt;/h3&gt;&lt;p&gt;Город изменился. Лида сворачивает к морю и решает отложить встречу с матерью.&lt;/p&gt;&lt;small&gt;Старый город · Лида&lt;/small&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;sl-scene&quot;&gt;&lt;span class=&quot;sl-order&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Открытая дверь&lt;/h3&gt;&lt;p&gt;Дом пуст, но на кухне ещё тёплый чай. На столе лежит второе письмо.&lt;/p&gt;&lt;small&gt;Дом Марины · Лида&lt;/small&gt;&lt;/div&gt;&lt;/article&gt;&lt;/section&gt;&lt;/template&gt;
&lt;template id=&quot;sl-timeline-template&quot;&gt;&lt;section class=&quot;sl-timeline&quot; aria-label=&quot;Хронология истории&quot;&gt;&lt;h2&gt;Хронология&lt;/h2&gt;&lt;p class=&quot;sl-subtitle&quot;&gt;События книги по порядку&lt;/p&gt;&lt;div class=&quot;sl-event&quot;&gt;&lt;time&gt;За 12 лет&lt;br&gt;до приезда&lt;/time&gt;&lt;div class=&quot;sl-eventbody&quot;&gt;&lt;h3&gt;Лида уезжает из города&lt;/h3&gt;&lt;p&gt;После ссоры с матерью она обещает больше не возвращаться.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sl-event&quot;&gt;&lt;time&gt;14 октября&lt;/time&gt;&lt;div class=&quot;sl-eventbody&quot;&gt;&lt;h3&gt;Первое письмо&lt;/h3&gt;&lt;p&gt;Среди старых бумаг Лида находит конверт с незнакомым почерком.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sl-event&quot;&gt;&lt;time&gt;16 октября&lt;/time&gt;&lt;div class=&quot;sl-eventbody&quot;&gt;&lt;h3&gt;Дорога к морю&lt;/h3&gt;&lt;p&gt;Ночной поезд. Разговор с попутчиком о старой пристани.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sl-event&quot;&gt;&lt;time&gt;17 октября&lt;br&gt;Утро&lt;/time&gt;&lt;div class=&quot;sl-eventbody&quot;&gt;&lt;h3&gt;Возвращение на станцию&lt;/h3&gt;&lt;p&gt;Глава 3. Смотрительница узнаёт фамилию Лиды.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sl-event&quot;&gt;&lt;time&gt;17 октября&lt;br&gt;После полудня&lt;/time&gt;&lt;div class=&quot;sl-eventbody&quot;&gt;&lt;h3&gt;Второе письмо&lt;/h3&gt;&lt;p&gt;В пустом доме Лида находит объяснение, которого ждала двенадцать лет.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/template&gt;
&lt;template id=&quot;sl-materials-template&quot;&gt;&lt;div class=&quot;sl-panelhead&quot;&gt;&lt;span&gt;Материалы&lt;/span&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;materials&quot; aria-label=&quot;Закрыть материалы&quot;&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;×&lt;/i&gt;&lt;/button&gt;&lt;/div&gt;&lt;nav class=&quot;sl-materialnav&quot; aria-label=&quot;Виды материалов&quot;&gt;&lt;button class=&quot;cursor-interaction&quot; data-material=&quot;character&quot; aria-pressed=&quot;true&quot;&gt;Персонажи&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-material=&quot;world&quot; aria-pressed=&quot;false&quot;&gt;Мир&lt;/button&gt;&lt;button class=&quot;cursor-interaction&quot; data-material=&quot;notes&quot; aria-pressed=&quot;false&quot;&gt;Заметки&lt;/button&gt;&lt;/nav&gt;&lt;div class=&quot;sl-ref&quot; data-ref&gt;&lt;/div&gt;&lt;/template&gt;
&lt;template id=&quot;sl-character-template&quot;&gt;&lt;div class=&quot;sl-letter&quot; aria-hidden=&quot;true&quot;&gt;Л.&lt;/div&gt;&lt;h3 class=&quot;sl-refname&quot;&gt;Лида Соколова&lt;/h3&gt;&lt;p class=&quot;sl-reftype&quot;&gt;Главная героиня&lt;/p&gt;&lt;div class=&quot;sl-refbody&quot;&gt;&lt;p&gt;Переводчица, 32 года. Вернулась в родной город после двенадцати лет молчания.&lt;/p&gt;&lt;h4&gt;Что важно помнить&lt;/h4&gt;&lt;p&gt;Когда нервничает, крутит кольцо на правой руке. Называет мать по имени.&lt;/p&gt;&lt;div class=&quot;sl-note&quot;&gt;Она приехала за ответами, но боится задать первый вопрос.&lt;/div&gt;&lt;/div&gt;&lt;/template&gt;
&lt;template id=&quot;sl-world-template&quot;&gt;&lt;div class=&quot;sl-letter&quot; aria-hidden=&quot;true&quot;&gt;&lt;i aria-hidden=&quot;true&quot; style=&quot;font-style:normal&quot;&gt;≈&lt;/i&gt;&lt;/div&gt;&lt;h3 class=&quot;sl-refname&quot;&gt;Приморск&lt;/h3&gt;&lt;p class=&quot;sl-reftype&quot;&gt;Место действия&lt;/p&gt;&lt;div class=&quot;sl-refbody&quot;&gt;&lt;p&gt;Небольшой портовый город. От станции до старой пристани — двадцать минут пешком.&lt;/p&gt;&lt;h4&gt;Атмосфера&lt;/h4&gt;&lt;p&gt;Соль на окнах, низкое небо, пустые дачи. После сентября город принадлежит местным.&lt;/p&gt;&lt;div class=&quot;sl-note&quot;&gt;Море слышно из дома Марины, но не видно.&lt;/div&gt;&lt;/div&gt;&lt;/template&gt;
&lt;template id=&quot;sl-notes-template&quot;&gt;&lt;h3 class=&quot;sl-refname&quot;&gt;К этой главе&lt;/h3&gt;&lt;p class=&quot;sl-reftype&quot;&gt;Свободные заметки&lt;/p&gt;&lt;div class=&quot;sl-refbody&quot;&gt;&lt;p&gt;Не рассказывать сразу, почему Лида уехала. Пусть это станет понятно из разговора с матерью.&lt;/p&gt;&lt;h4&gt;Деталь для сцены&lt;/h4&gt;&lt;p&gt;Старое расписание электричек до сих пор висит у кассы. Лида узнаёт почерк отца.&lt;/p&gt;&lt;div class=&quot;sl-note&quot;&gt;Вернуться к образу пустой скамейки в последней главе.&lt;/div&gt;&lt;/div&gt;&lt;/template&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;storylens-designs&#x27;);
  const names = [&#x27;Письмо&#x27;, &#x27;Чужой город&#x27;, &#x27;Станция у моря&#x27;];
  const kickers = [&#x27;Глава первая&#x27;, &#x27;Глава вторая&#x27;, &#x27;Глава третья&#x27;];
  const prose = [
    [&#x27;Письмо лежало между квитанцией за свет и старой открыткой. Лида вытащила конверт и сразу узнала бумагу: такими листами мать застилала ящики комода.&#x27;, &#x27;На конверте не было ни марки, ни обратного адреса. Только её имя, написанное незнакомой рукой.&#x27;, &#x27;За окном стемнело. Она включила лампу, пододвинула чашку и ещё несколько минут смотрела на закрытый конверт.&#x27;, &#x27;Потом встала и достала с верхней полки чемодан.&#x27;],
    [&#x27;Ночью город был похож на фотографию, которую забыли проявить. За стеклом такси проплывали вывески, остановки и тёмные окна чужих кухонь.&#x27;, &#x27;Лида прижала лоб к холодному стеклу. Она не знала ни одной улицы, но почему-то была уверена: водитель везёт её в другую сторону.&#x27;, &#x27;На вокзале пахло кофе и свежей краской. До отправления оставалось сорок минут.&#x27;, &#x27;Она купила билет до конечной и только тогда позвонила домой. Никто не ответил.&#x27;]
  ];
  let saved = window.openai?.widgetState || {};
  const entries = [];
  const clone = id =&gt; document.getElementById(id).content.cloneNode(true);
  function persist() {
    if (!window.openai?.setWidgetState) return;
    const views = Object.fromEntries(entries.map(({app,state}) =&gt; [app.dataset.design, {view:state.view, chapter:state.chapter, materials:state.materials, material:state.material, focus:state.focus}]));
    window.openai.setWidgetState({modelContent:{designs:views}, privateContent:null}).catch(() =&gt; {});
  }
  function icons() { if (globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}}); }
  root.querySelectorAll(&#x27;[data-design]&#x27;).forEach(app =&gt; {
    const id = app.dataset.design;
    const state = {view:&#x27;text&#x27;,chapter:2,materials:id===&#x27;desk&#x27;,material:&#x27;character&#x27;,focus:false,size:id===&#x27;familiar&#x27;?18:19,leading:1.85,measure:id===&#x27;desk&#x27;?56:57};
    function restore(value) {
      if (!value || typeof value !== &#x27;object&#x27;) return;
      if ([&#x27;text&#x27;,&#x27;plan&#x27;,&#x27;timeline&#x27;].includes(value.view)) state.view=value.view;
      if (Number.isInteger(value.chapter) &amp;&amp; value.chapter&gt;=0 &amp;&amp; value.chapter&lt;=2) state.chapter=value.chapter;
      if (typeof value.materials===&#x27;boolean&#x27;) state.materials=value.materials;
      if ([&#x27;character&#x27;,&#x27;world&#x27;,&#x27;notes&#x27;].includes(value.material)) state.material=value.material;
      if (typeof value.focus===&#x27;boolean&#x27;) state.focus=value.focus;
    }
    restore(saved.modelContent?.designs?.[id]);
    const pane=app.querySelector(&#x27;[data-pane]&#x27;);
    pane.setAttribute(&#x27;aria-live&#x27;,&#x27;polite&#x27;);
    const materialPanel=app.querySelector(&#x27;[data-material-panel]&#x27;);
    materialPanel.append(clone(&#x27;sl-materials-template&#x27;));
    function renderMaterial() {
      materialPanel.querySelector(&#x27;[data-ref]&#x27;).replaceChildren(clone(&#x27;sl-&#x27;+state.material+&#x27;-template&#x27;));
      materialPanel.querySelectorAll(&#x27;[data-material]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.material===state.material)));
      icons();
    }
    function renderContent() {
      pane.replaceChildren(clone(state.view===&#x27;text&#x27;?&#x27;sl-document-template&#x27;:state.view===&#x27;plan&#x27;?&#x27;sl-plan-template&#x27;:&#x27;sl-timeline-template&#x27;));
      if(state.view===&#x27;text&#x27;) {
        pane.querySelector(&#x27;[data-document-title]&#x27;).textContent=names[state.chapter];
        pane.querySelector(&#x27;[data-document-kicker]&#x27;).textContent=kickers[state.chapter];
        if(state.chapter&lt;2) {
          const body=pane.querySelector(&#x27;[data-document-prose]&#x27;);body.replaceChildren();
          prose[state.chapter].forEach(text=&gt;{const p=document.createElement(&#x27;p&#x27;);p.textContent=text;body.append(p)});
        }
      }
      app.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.view===state.view)));
      app.querySelectorAll(&#x27;[data-chapter]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(Number(b.dataset.chapter)===state.chapter)));
      const select=app.querySelector(&#x27;[data-chapter-select]&#x27;);if(select) select.value=String(state.chapter);
      const label=app.querySelector(&#x27;[data-chapter-label]&#x27;);if(label) label.textContent=names[state.chapter];
      app.querySelector(&#x27;[data-context]&#x27;).textContent=state.view===&#x27;text&#x27;?&#x27;Глава &#x27;+(state.chapter+1)+&#x27; из 3&#x27;:state.view===&#x27;plan&#x27;?&#x27;План · глава 3&#x27;:&#x27;Хронология книги&#x27;;
      pane.setAttribute(&#x27;aria-label&#x27;,state.view===&#x27;text&#x27;?names[state.chapter]:state.view===&#x27;plan&#x27;?&#x27;План сцен&#x27;:&#x27;Хронология&#x27;);

        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();

<script>(() => {
  const frame = document.getElementById("codex-visualization");

    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",

    }

    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||

      throw new TypeError("Widget state must be a JSON object");

      storedState,
      (_key, /** @type {unknown} */ value) => {

    );

    localStorage.removeItem(probeKey);

  channel.port1.addEventListener("message", (event) => {

        typeof height !== "number" ||
        !Number.isFinite(height) ||

            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,

    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true

      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);

  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000

      }

      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
